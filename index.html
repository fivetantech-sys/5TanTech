<!DOCTYPE html>
<html>
<head>
  <!-- REQUIRED placeholder for Flutter build -->
  <base href="/5TanTech/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="We Honor Our Commitment With Integrity And Quality">

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="5Tan Tech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>5Tan Tech</title>
  <link rel="manifest" href="manifest.json">

  <script>
    const serviceWorkerVersion = "1470102542";
  </script>

  <!-- Prevent CanvasKit white screen -->
  <script>
    window.flutterWebRenderer = "html";
  </script>

  <script src="flutter.js" defer></script>
</head>

<body>
<script>
  window.addEventListener('load', function () {
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine().then(function (appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
